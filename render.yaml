# Déploiement en un clic sur Render : un service web (Docker) et une base PostgreSQL.
services:
  - type: web
    name: kredi
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kredi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: 'true'
      - key: APP_URL
        sync: false
      - key: DEMO_MODE
        value: 'true'
      # Pour encaisser réellement : renseigner les clés FedaPay (le mode simulé est alors désactivé).
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: FEDAPAY_WEBHOOK_SECRET
        sync: false
      - key: FEDAPAY_ENV
        value: sandbox

databases:
  - name: kredi-db
    plan: free
